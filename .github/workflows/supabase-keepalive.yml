name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without activity.
# This pings the REST API every 3 days so the project stays awake.

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets first." >&2
            exit 1
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1")

          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
